<!doctype html>
<html lang="es-PE">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rubric — Quipu</title></head>
<body>

<div class="wq-root">
  <table class="wq-rubric">
    <caption class="wq-sr">Rúbrica de la pregunta 5</caption>
    <thead><tr><th scope="col">Criterio</th><th scope="col">Insuficiente</th><th scope="col">En proceso</th><th scope="col">Logrado</th><th scope="col">Destacado</th></tr></thead>
    <tbody>
      <tr><th scope="row">Identifica riesgos<small>peso 50 %</small></th>
        <td><button class="wq-level" aria-pressed="false"><strong>0 pts</strong>No menciona riesgos.</button></td>
        <td><button class="wq-level" aria-pressed="false"><strong>1 pt</strong>Menciona uno, sin explicar.</button></td>
        <td><button class="wq-level" aria-pressed="true"><strong>2 pts</strong>Explica dos riesgos.</button></td>
        <td><button class="wq-level" aria-pressed="false"><strong>3 pts</strong>Dos riesgos con un ejemplo real.</button></td></tr>
      <tr><th scope="row">Argumentación<small>peso 50 %</small></th>
        <td><button class="wq-level" aria-pressed="false"><strong>0 pts</strong>Sin argumento.</button></td>
        <td><button class="wq-level" aria-pressed="false"><strong>1 pt</strong>Argumento débil.</button></td>
        <td><button class="wq-level" aria-pressed="false"><strong>2 pts</strong>Argumento claro.</button></td>
        <td><button class="wq-level" aria-pressed="true"><strong>3 pts</strong>Claro y con fuentes.</button></td></tr>
    </tbody>
  </table>
  <div class="wq-grade-total">
    <div><div class="wq-caption-label">Nota de la pregunta</div><div class="wq-grade-change"><s aria-label="nota anterior">4</s><span class="wq-i wq-i-arrow-r " aria-hidden="true"></span><span>5 / 6</span></div></div>
    <div class="wq-field" style="flex:1 1 280px"><label class="wq-label" for="m">Motivo del cambio de nota <span class="wq-opt">(lo verá la estudiante)</span></label><input class="wq-input" id="m" value="Reconsidero el ejemplo del distrito de Cayma como fuente válida."></div>
    <button class="wq-btn wq-btn--primary">Guardar y publicar nota</button>
  </div>
</div>
<script></script>
</body>
</html>
