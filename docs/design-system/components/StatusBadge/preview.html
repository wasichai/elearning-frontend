<!-- @dsCard group="Estado y progreso" height=190 -->
<!doctype html>
<html lang="es-PE">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StatusBadge — Quipu</title></head>
<body>

<div class="wq-root">
  <div class="wq-row">
    <span class="wq-badge wq-badge--todo"><span class="wq-i wq-i-circle " aria-hidden="true"></span>No iniciado</span>
    <span class="wq-badge wq-badge--active"><span class="wq-i wq-i-half " aria-hidden="true"></span>En curso</span>
    <span class="wq-badge wq-badge--done"><span class="wq-i wq-i-check-circle " aria-hidden="true"></span>Completado</span>
    <span class="wq-badge wq-badge--overdue"><span class="wq-i wq-i-clock-x " aria-hidden="true"></span>Vencido</span>
    <span class="wq-badge wq-badge--review"><span class="wq-i wq-i-hourglass " aria-hidden="true"></span>Pendiente de corrección</span>
  </div>
  <div class="wq-row">
    <span class="wq-badge wq-badge--warning"><span class="wq-i wq-i-clock " aria-hidden="true"></span>Vence en 2 días</span>
    <span class="wq-badge wq-badge--achievement"><span class="wq-i wq-i-award " aria-hidden="true"></span>Certificado</span>
    <span class="wq-badge wq-badge--live">En vivo ahora</span>
    <span class="wq-badge wq-badge--outline">3 ECTS</span>
    <span class="wq-badge">Edición 2026-II</span>
  </div>
</div>
<script></script>
</body>
</html>
