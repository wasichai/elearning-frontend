<!doctype html>
<html lang="es-PE">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — Quipu</title></head>
<body>

<div class="wq-root">
  <div class="wq-row">
    <button class="wq-btn wq-btn--primary">Continuar lección 5 <span class="wq-i wq-i-arrow-r " aria-hidden="true"></span></button>
    <button class="wq-btn"><span class="wq-i wq-i-download " aria-hidden="true"></span> Descargar guía</button>
    <button class="wq-btn wq-btn--ghost">Ver temario</button>
    <button class="wq-btn wq-btn--danger"><span class="wq-i wq-i-trash " aria-hidden="true"></span> Cancelar sesión</button>
    <button class="wq-btn wq-btn--danger-quiet">Retirar matrícula</button>
  </div>
  <div class="wq-row">
    <button class="wq-btn wq-btn--celebrate"><span class="wq-i wq-i-award " aria-hidden="true"></span> Ver mi certificado</button>
    <button class="wq-btn wq-btn--primary is-loading" aria-busy="true"><span class="wq-spinner" aria-hidden="true"></span>Entregando…</button>
    <button class="wq-btn wq-btn--primary" disabled>Matricularme</button>
    <button class="wq-btn wq-btn--icon wq-btn--ghost" aria-label="Abrir menú"><span class="wq-i wq-i-menu " aria-hidden="true"></span></button>
    <button class="wq-btn wq-btn--icon" aria-label="Imprimir certificado"><span class="wq-i wq-i-printer " aria-hidden="true"></span></button>
  </div>
  <div class="wq-row">
    <button class="wq-btn wq-btn--sm wq-btn--primary">Guardar nota</button>
    <button class="wq-btn wq-btn--sm"><span class="wq-i wq-i-edit wq-i--sm" aria-hidden="true"></span> Reprogramar</button>
    <button class="wq-btn wq-btn--sm wq-btn--ghost">Más acciones <span class="wq-i wq-i-chev-d wq-i--sm" aria-hidden="true"></span></button>
    <span class="wq-caption-label">Tamaño sm: solo en tablas docentes de escritorio (área táctil ampliada a 44px).</span>
  </div>
  <div class="wq-row" style="max-width:360px"><button class="wq-btn wq-btn--primary wq-btn--block">Comenzar intento 2 de 3</button></div>
</div>
<script></script>
</body>
</html>
